<app-header></app-header>

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Alumni</h2>

    <button class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Add Alumnus
    </button>
  </div>

  <!-- Search -->
  <div class="input-group mb-3">
    <input type="text" class="form-control" [value]="searchText()"
    (input)="searchText.set($any($event.target).value)" placeholder="Search..." />
    <button class="btn btn-outline-secondary" (click)="clearSearch()">Clear</button>
  </div>

  <!-- Table -->
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>

    <tbody>
        <tr *ngFor="let user of filteredUsers() | paginate: { itemsPerPage: 3, currentPage: page() }; let i = index">
          <td>{{ (page() - 1) * 3 + i + 1 }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
    </tbody>
  </table>

  <!-- Pagination Controls -->
<ngb-pagination
  [collectionSize]="totalItems"
  [(page)]="currentPage"
  [pageSize]="itemsPerPage"
  [maxSize]="5"
  [rotate]="true"
  (pageChange)="loadPage($event)"
  aria-label="Default pagination"
></ngb-pagination>

</div>

<app-footer></app-footer>
