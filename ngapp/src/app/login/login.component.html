<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 380px;">
      <div class="text-center mb-3">
        <img src="assets/images/kulogo.png" class="img-fluid mb-3" alt="Logo">
      </div>

    <h3 class="text-center mb-4">Login</h3>

    <form [formGroup]="form" (ngSubmit)="submit()">    
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" />
        <div class="text-danger mt-1"
             *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" />
        <div class="text-danger mt-1"
             *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required.
        </div>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <div class="text-danger text-center mt-3" *ngIf="error">
        {{ error }}
      </div>
    </form>
  </div>
</div>
