services:
  redisdb:
    image: "redis:latest"
    container_name: redis-service
    ports:
      - "6379:6379"
  
  postgresdb:
    image: postgres:alpine
    container_name: postgres-service 
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PGSQL_PASSWORD}
      DB_PGSQL_HOST: ${DB_PGSQL_HOST}
      DB_PGSQL_USER: ${DB_PGSQL_USER}
      DB_PGSQL_PASSWORD: ${DB_PGSQL_PASSWORD}
      DB_PGSQL_DBNAME: ${DB_PGSQL_DBNAME}
      DB_PGSQL_PORT: ${DB_PGSQL_PORT}
      DB_USED: ${DB_USED}
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
      # copy the sql script to create tables
      - ./postgres/entrypoint:/docker-entrypoint-initdb.d

  goapp-service:
    container_name: goapp-service
    restart: always
    env_file: 
      - .env
    depends_on:
      - "redisdb"
      - "postgresdb"  
    ports:
      - "81:81"
    build:
      context: ./goapp
      dockerfile: Dockerfile
      args:
        buildno: 1
    volumes:
      - "./storage/log:/app/log"
      #- "./storage/sqlite:/app/sqlite"

  ngapp-service:
    container_name: ngapp-service
    restart: always
    depends_on:
      - "redisdb"
      - "postgresdb"  
      - "goapp-service"  
    ports:
      - "80:80"
    env_file: .env
    build:
      context: ./ngapp
      dockerfile: Dockerfile
      args:
        buildno: 1

